- title: "Low-Resource ASR"
  description: "Exploring methods for rapidly adapting speech recognition models to endangered and under-documented languages, drawing on recordings from the Endangered Languages Archive."
  tags:
    - "speech recognition"
    - "endangered languages"
  link: "projects/asr.html"
